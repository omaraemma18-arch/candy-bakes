<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Cakes | Birthday, Wedding &amp; Cupcakes | Candycakes</title>
<meta name="description" content="Browse our full range of custom cakes. Choose flavour, size and your own icing message.">
<link rel="canonical" href="/menu">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎂</text></svg>">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="site-header"></div>
<main>
  <section class="section">
    <div class="wrap">
      <div class="section-head">
        <h1>Our cakes</h1>
        <p>Everything is baked to order. Pick one to choose your flavour, size and message.</p>
      </div>
      <div class="filters">
        <button class="filter-btn active" data-category="all">Everything</button>
        <button class="filter-btn" data-category="birthday">Birthday</button>
        <button class="filter-btn" data-category="wedding">Weddings</button>
        <button class="filter-btn" data-category="cupcakes">Cupcakes</button>
        <button class="filter-btn" data-category="other">Other</button>
        <div class="search-box">
          <input type="search" class="control" id="searchInput" placeholder="Search cakes…" aria-label="Search cakes">
        </div>
      </div>
      <div id="menuArea"><div class="spinner"></div></div>
    </div>
  </section>
</main>
<div id="site-footer"></div>
<script src="/js/app.js"></script>
<script src="/js/partials.js"></script>
<script src="/js/menu.js"></script>
</body>
</html>
