<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orders | Sugarhouse Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎂</text></svg>">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/admin.css">
</head>
<body>
<div class="admin-shell">
  <div id="admin-sidebar"></div>
  <div class="admin-content">
    <div id="admin-topbar"></div>
    <main class="admin-main">

      <div class="filters" id="statusFilters">
        <button class="filter-btn active" data-status="all">All</button>
        <button class="filter-btn" data-status="pending">Pending</button>
        <button class="filter-btn" data-status="confirmed">Confirmed</button>
        <button class="filter-btn" data-status="baking">Baking</button>
        <button class="filter-btn" data-status="ready">Ready</button>
        <button class="filter-btn" data-status="completed">Completed</button>
      </div>
      <div id="ordersArea"><div class="spinner"></div></div>
    </main>
  </div>
</div>
<script src="/js/app.js"></script>
<script src="/js/admin/shell.js"></script>
<script src="/js/admin/orders.js"></script>
</body>
</html>
