<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | Candycakes</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="/images/candycakes-logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/admin.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="logo">
      <img src="/images/candycakes-logo.svg" alt="Candycakes">
    </div>
    <h1>Sign in</h1>
    <p class="sub">Staff and owner access only.</p>

    <div class="alert alert-error" id="formAlert"></div>

    <form id="loginForm" novalidate>
      <div class="field" data-field="email">
        <label for="email">Email</label>
        <input type="email" class="control" id="email" autocomplete="username">
        <div class="field-error">Enter a valid email address.</div>
      </div>
      <div class="field" data-field="password">
        <label for="password">Password</label>
        <input type="password" class="control" id="password" autocomplete="current-password">
        <div class="field-error">Enter your password.</div>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Sign in</button>
    </form>

    <p style="margin:20px 0 0;text-align:center;font-size:.86rem;">
      <a href="/" style="color:var(--muted);">&larr; Back to the shop</a>
    </p>
  </div>
</div>
<script src="/js/app.js"></script>
<script src="/js/admin/login.js"></script>
</body>
</html>
