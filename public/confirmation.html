<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Confirmed | Sugarhouse Bakery</title>
<meta name="description" content="Your cake order has been received.">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎂</text></svg>">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="site-header"></div>
<main>
  <div class="confirm-box">
    <div class="confirm-mark" aria-hidden="true">✓</div>
    <h1>Your order is in</h1>
    <p id="confirmIntro" style="margin:0 auto 20px;color:var(--muted);">We've sent the details through to the kitchen.</p>
    <div class="confirm-ref" id="orderRef">—</div>
    <div class="panel" style="text-align:left;" id="orderDetails"></div>
    <p style="color:var(--muted);font-size:.92rem;">We'll call you to confirm everything before we start baking. To change anything, ring <a href="tel:+256700000000" style="color:var(--raspberry);font-weight:600;">+256 700 000 000</a>.</p>
    <a href="/menu" class="btn btn-dark" style="margin-top:12px;">Back to the cakes</a>
  </div>
</main>
<div id="site-footer"></div>
<script src="/js/app.js"></script>
<script src="/js/partials.js"></script>
<script src="/js/confirmation.js"></script>
</body>
</html>
